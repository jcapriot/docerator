[workspace]
resolver = "2"
members = ["crates/docerator-core", "crates/docerator-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ruff_python_parser = "=0.0.8"
ruff_python_ast = "=0.0.8"
ruff_text_size = "=0.0.8"
ruff_source_file = "=0.0.8"
ruff_python_trivia = "=0.0.8"
salsa = "=0.28.2"
indexmap = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
