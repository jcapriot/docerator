[package]
name = "docerator-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "docerator"
path = "src/main.rs"

[dependencies]
docerator-core = { path = "../docerator-core" }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
